name: paperhands
region: nyc

services:
  # Backend API
  - name: api
    github:
      repo: 0x000NULL/PaperHands
      branch: main
      deploy_on_push: true
    source_dir: /
    build_command: npm install -g pnpm && pnpm install && pnpm run build:api
    run_command: node apps/api/dist/main.js
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    http_port: 3000
    health_check:
      http_path: /health
      initial_delay_seconds: 15
      period_seconds: 30
      timeout_seconds: 5
    envs:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: REDIS_HOST
        scope: RUN_TIME
        value: ${redis.HOSTNAME}
      - key: REDIS_PORT
        scope: RUN_TIME
        value: ${redis.PORT}
      - key: REDIS_PASSWORD
        scope: RUN_TIME
        value: ${redis.PASSWORD}
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: TRADIER_API_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: TRADIER_BASE_URL
        value: "https://sandbox.tradier.com/v1"
      - key: FRONTEND_URL
        scope: RUN_TIME
        value: ${paperhands-web.PUBLIC_URL}

static_sites:
  # Frontend Web (Static React SPA)
  - name: paperhands-web
    github:
      repo: 0x000NULL/PaperHands
      branch: main
      deploy_on_push: true
    source_dir: /
    build_command: npm install -g pnpm && pnpm install && pnpm run build:web
    output_dir: apps/web/dist
    index_document: index.html
    error_document: index.html
    environment_slug: node-js
    envs:
      - key: VITE_API_URL
        scope: BUILD_TIME
        value: ${api.PUBLIC_URL}

databases:
  - name: db
    engine: PG
    version: "16"
    size: db-s-dev-database
    num_nodes: 1

  - name: redis
    engine: REDIS
    version: "7"
    size: db-s-dev-database
    num_nodes: 1
