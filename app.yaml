name: paperhands
region: sfo3

services:
  # Backend API
  - name: api
    github:
      repo: 0x000NULL/PaperHands
      branch: main
      deploy_on_push: true
    source_dir: /
    build_command: pnpm install && pnpm run build:api
    run_command: node apps/api/dist/main.js
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: apps-d-1vcpu-2gb
    http_port: 3000
    health_check:
      http_path: /health
      initial_delay_seconds: 15
      period_seconds: 30
      timeout_seconds: 5
    routes:
      - path: /api
        preserve_path_prefix: false
    envs:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        type: SECRET
        # Note: Use URL without sslmode param, TypeORM handles SSL config
      - key: REDIS_HOST
        type: SECRET
      - key: REDIS_PORT
        value: "25061"
      - key: REDIS_PASSWORD
        type: SECRET
      - key: JWT_SECRET
        type: SECRET
      - key: FINNHUB_API_KEY
        type: SECRET
      - key: FINNHUB_BASE_URL
        value: "https://finnhub.io/api/v1"
      - key: FRONTEND_URL
        value: ${_self.PUBLIC_URL}

static_sites:
  # Frontend Web (Static React SPA)
  - name: frontend
    github:
      repo: 0x000NULL/PaperHands
      branch: main
      deploy_on_push: true
    source_dir: /
    build_command: pnpm install && pnpm run build:web
    output_dir: apps/web/dist
    index_document: index.html
    error_document: index.html
    environment_slug: node-js
    routes:
      - path: /
    envs:
      - key: VITE_API_URL
        scope: BUILD_TIME
        value: ${_self.PUBLIC_URL}api
